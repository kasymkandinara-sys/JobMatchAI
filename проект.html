<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JobMatch AI — Казахстан</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px;
            padding-bottom: 80px;
            min-height: 100vh;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border: 1px solid #eef2ff;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1e1b4b;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            font-size: 16px;
            font-family: inherit;
            margin-bottom: 12px;
            transition: 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.97);
        }

        .job-item {
            background: linear-gradient(135deg, #f5f3ff, #ede9fe);
            padding: 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: 0.2s;
        }

        .job-item:hover {
            transform: translateX(5px);
        }

        .job-title {
            font-weight: 700;
            margin-bottom: 4px;
            color: #1e1b4b;
        }

        .job-company {
            font-size: 13px;
            color: #6b7280;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 32px;
            padding: 24px;
        }

        .hidden {
            display: none;
        }

        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 20px 24px;
            border-top: 1px solid #e2e8f0;
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
        }

        .tab {
            text-align: center;
            font-size: 12px;
            color: #64748b;
            cursor: pointer;
            padding: 8px;
            transition: 0.2s;
        }

        .tab.active {
            color: #667eea;
            font-weight: 600;
        }

        .page {
            display: none;
        }

        .page.active-page {
            display: block;
        }

        .strength-badge {
            background: #dcfce7;
            color: #166534;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin: 4px;
            font-size: 12px;
        }

        .improve-badge {
            background: #fee2e2;
            color: #991b1b;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin: 4px;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .salary {
            font-size: 14px;
            font-weight: 600;
            color: #059669;
            margin-top: 6px;
        }

        .match {
            font-size: 12px;
            color: #667eea;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <!-- Страница профиля -->
    <div id="profilePage" class="page active-page">
        <div class="header">
            <div class="logo">🇰🇿 JobMatch AI</div>
            <div class="avatar" id="avatarBtn" onclick="openProfileModal()">👤</div>
        </div>

        <div class="card">
            <div class="card-title">📋 Мой профиль</div>
            <input type="text" id="profileName" placeholder="Ваше имя">
            <input type="text" id="profileAvatar" placeholder="Аватар (emoji) 👨‍💻">
            <textarea id="profileSkills" rows="4" placeholder="Напишите ваши навыки через запятую&#10;Например: JavaScript, React, Python, аналитика данных, английский C1..."></textarea>
            <button onclick="saveProfile()">💾 Сохранить профиль</button>
        </div>

        <div class="card">
            <div class="card-title">🤖 AI Анализ навыков</div>
            <button onclick="runAIAnalysis()">✨ Запустить AI анализ</button>
            <div id="aiResult" style="margin-top: 16px;"></div>
        </div>

        <div class="card">
            <div class="card-title">📊 Статистика</div>
            <div id="stats">
                <p>🎯 Навыков в профиле: <span id="matchCount">0</span></p>
                <p>🇰🇿 Рынок Казахстана</p>
            </div>
        </div>
    </div>

    <!-- Страница вакансий -->
    <div id="jobsPage" class="page">
        <div class="header">
            <div class="logo">🔥 Вакансии</div>
            <div></div>
        </div>
        <div class="card">
            <div class="card-title">💼 Актуальные предложения в Казахстане</div>
            <button onclick="searchJobs()">🔍 Найти вакансии по моим навыкам</button>
            <div id="jobsList" style="margin-top: 16px;"></div>
        </div>
    </div>

    <!-- Модалка редактирования профиля -->
    <div id="profileModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 16px;">✏️ Редактировать профиль</h3>
            <input type="text" id="editName" placeholder="Имя">
            <input type="email" id="editEmail" placeholder="Email">
            <input type="text" id="editAvatar" placeholder="Avatar emoji">
            <button onclick="updateProfileModal()">Сохранить</button>
            <button onclick="closeProfileModal()" style="background:#e2e8f0; color:#1e293b; margin-top:8px;">Отмена</button>
        </div>
    </div>
</div>

<div class="tab-bar">
    <div class="tab active" onclick="switchPage('profile')">👤 Профиль</div>
    <div class="tab" onclick="switchPage('jobs')">💼 Вакансии</div>
</div>

<script>
    // ========== Управление данными через localStorage ==========
    let currentUser = null;

    // Курс валют для конвертации (примерный)
    const USD_TO_KZT = 470; // 1$ ≈ 470₸

    // Конвертация в тенге
    function toTenge(usdAmount) {
        const amount = parseInt(usdAmount) || 0;
        return Math.round(amount * USD_TO_KZT).toLocaleString('ru-KZ');
    }

    // Форматирование зарплаты в тенге
    function formatSalary(salaryStr) {
        if (!salaryStr) return 'з/п не указана';
        
        // Если уже есть тенге
        if (salaryStr.includes('₸')) return salaryStr;
        
        // Парсим числа из строки
        const numbers = salaryStr.match(/\d+/g);
        if (!numbers) return salaryStr;
        
        if (numbers.length === 1) {
            return `${toTenge(numbers[0])} ₸`;
        } else if (numbers.length === 2) {
            return `${toTenge(numbers[0])} - ${toTenge(numbers[1])} ₸`;
        }
        return salaryStr;
    }

    // Загрузка пользователя при старте
    function loadUser() {
        const savedUser = localStorage.getItem('jobmatch_user');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            document.getElementById('profileName').value = currentUser.name || '';
            document.getElementById('profileAvatar').value = currentUser.avatar || '👤';
            document.getElementById('profileSkills').value = currentUser.skills || '';
            document.getElementById('avatarBtn').innerHTML = currentUser.avatar || '👤';
            updateStats();
        } else {
            // Создаём тестового пользователя
            currentUser = {
                id: Date.now(),
                name: 'Анна',
                email: 'anna@example.com',
                avatar: '👩‍💻',
                skills: 'JavaScript, React, Python, аналитика данных, английский C1',
                createdAt: new Date().toISOString()
            };
            saveUserToLocal();
            document.getElementById('profileName').value = currentUser.name;
            document.getElementById('profileAvatar').value = currentUser.avatar;
            document.getElementById('profileSkills').value = currentUser.skills;
            document.getElementById('avatarBtn').innerHTML = currentUser.avatar;
        }
    }

    function saveUserToLocal() {
        localStorage.setItem('jobmatch_user', JSON.stringify(currentUser));
    }

    function saveProfile() {
        currentUser.name = document.getElementById('profileName').value;
        currentUser.avatar = document.getElementById('profileAvatar').value;
        currentUser.skills = document.getElementById('profileSkills').value;
        saveUserToLocal();
        document.getElementById('avatarBtn').innerHTML = currentUser.avatar || '👤';
        alert('✅ Профиль сохранён!');
        updateStats();
    }

    function updateStats() {
        const skillsCount = currentUser.skills?.split(',').filter(s => s.trim()).length || 0;
        document.getElementById('matchCount').innerHTML = skillsCount;
    }

    // ========== AI Анализ (имитация ИИ на фронтенде) ==========
    async function runAIAnalysis() {
        const skills = currentUser.skills || '';
        if (!skills) {
            alert('Сначала добавьте навыки в профиль');
            return;
        }

        document.getElementById('aiResult').innerHTML = '<div class="loading">🤔 AI анализирует ваши навыки...</div>';

        setTimeout(() => {
            const skillsLower = skills.toLowerCase();
            const strengths = [];
            const improvements = [];
            const recommendedJobs = [];

            // Анализ навыков с зарплатами в тенге
            if (skillsLower.includes('javascript') || skillsLower.includes('react') || skillsLower.includes('vue')) {
                strengths.push('Frontend разработка');
                recommendedJobs.push({ title: 'Frontend Developer', salary: '350000 - 550000 ₸', match: '95%' });
            }
            if (skillsLower.includes('python')) {
                strengths.push('Python программирование');
                recommendedJobs.push({ title: 'Python Developer', salary: '400000 - 650000 ₸', match: '90%' });
            }
            if (skillsLower.includes('java')) {
                strengths.push('Java разработка');
                recommendedJobs.push({ title: 'Java Developer', salary: '450000 - 700000 ₸', match: '88%' });
            }
            if (skillsLower.includes('аналитик') || skillsLower.includes('data')) {
                strengths.push('Аналитика данных');
                recommendedJobs.push({ title: 'Data Analyst', salary: '350000 - 550000 ₸', match: '92%' });
            }
            if (skillsLower.includes('дизайн') || skillsLower.includes('ui') || skillsLower.includes('ux')) {
                strengths.push('UI/UX Дизайн');
                recommendedJobs.push({ title: 'UI/UX Designer', salary: '300000 - 500000 ₸', match: '85%' });
            }
            if (skillsLower.includes('английский')) {
                strengths.push('Английский язык');
                recommendedJobs.push({ title: 'International Specialist', salary: '500000 - 900000 ₸', match: '98%' });
            } else {
                improvements.push('Английский язык для работы в международных компаниях');
            }

            if (strengths.length === 0) {
                strengths.push('Базовые навыки (нужно больше опыта)');
                improvements.push('Изучите востребованные технологии: JavaScript, Python, аналитику');
                recommendedJobs.push({ title: 'Junior Developer', salary: '200000 - 350000 ₸', match: '60%' });
            }

            if (!skillsLower.includes('git')) improvements.push('Git и системы контроля версий');
            if (!skillsLower.includes('sql')) improvements.push('Базы данных SQL');
            if (!skillsLower.includes('казахский') && !skillsLower.includes('каз')) improvements.push('Казахский язык (плюс при трудоустройстве)');

            // Формируем HTML результата
            let html = `
                <div style="background:linear-gradient(135deg, #f5f3ff, #ede9fe); border-radius:20px; padding:16px;">
                    <div style="margin-bottom:12px">
                        <strong>✅ Сильные стороны:</strong><br>
                        ${strengths.map(s => `<span class="strength-badge">${s}</span>`).join('')}
                    </div>
                    <div style="margin-bottom:12px">
                        <strong>📈 Что улучшить:</strong><br>
                        ${improvements.map(i => `<span class="improve-badge">${i}</span>`).join('')}
                    </div>
                    <div>
                        <strong>🎯 Рекомендуемые вакансии в Казахстане:</strong><br><br>
                        ${recommendedJobs.map(job => `
                            <div class="job-item" style="cursor:default">
                                <div class="job-title">${job.title}</div>
                                <div class="salary">💰 ${job.salary}</div>
                                <div class="match">🎯 Совпадение: ${job.match}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('aiResult').innerHTML = html;
            
            localStorage.setItem('recommended_jobs', JSON.stringify(recommendedJobs));
        }, 1500);
    }

    // ========== Поиск реальных вакансий (через API hh.kz) ==========
    async function searchJobs() {
        const skills = currentUser.skills || '';
        if (!skills) {
            alert('Сначала добавьте навыки в профиль');
            return;
        }

        document.getElementById('jobsList').innerHTML = '<div class="loading">🔍 Ищем вакансии в Казахстане...</div>';

        try {
            const mainSkill = skills.split(',')[0].trim();
            // Используем hh.kz для Казахстана (area=40)
            const response = await fetch(`https://api.hh.ru/vacancies?text=${encodeURIComponent(mainSkill)}&per_page=10&area=40&currency=KZT`);
            const data = await response.json();
            
            if (data.items && data.items.length > 0) {
                const jobsHtml = data.items.map(job => {
                    let salaryText = 'з/п не указана';
                    if (job.salary) {
                        if (job.salary.from && job.salary.to) {
                            salaryText = `${job.salary.from.toLocaleString()} - ${job.salary.to.toLocaleString()} ₸`;
                        } else if (job.salary.from) {
                            salaryText = `от ${job.salary.from.toLocaleString()} ₸`;
                        } else if (job.salary.to) {
                            salaryText = `до ${job.salary.to.toLocaleString()} ₸`;
                        }
                    }
                    return `
                        <div class="job-item" onclick="window.open('${job.alternate_url}', '_blank')">
                            <div class="job-title">${job.name}</div>
                            <div class="job-company">🏢 ${job.employer.name}</div>
                            <div class="salary">💰 ${salaryText}</div>
                            <div style="font-size:12px; color:#667eea; margin-top:8px;">👆 Нажмите для просмотра</div>
                        </div>
                    `;
                }).join('');
                document.getElementById('jobsList').innerHTML = jobsHtml;
            } else {
                showDemoJobs();
            }
        } catch (error) {
            console.log('Ошибка API, показываем демо-вакансии');
            showDemoJobs();
        }
    }

    function showDemoJobs() {
        const demoJobs = [
            { title: 'Frontend React Developer', company: 'Kaspi Tech', salary: '400000 - 600000 ₸', match: '95%' },
            { title: 'Python Backend Developer', company: 'Halyk Bank', salary: '450000 - 700000 ₸', match: '88%' },
            { title: 'UI/UX Designer', company: 'Chocofamily', salary: '350000 - 550000 ₸', match: '82%' },
            { title: 'Data Analyst', company: 'Tele2', salary: '380000 - 580000 ₸', match: '91%' },
            { title: 'Fullstack JavaScript', company: 'Kolesa Group', salary: '420000 - 650000 ₸', match: '93%' },
            { title: 'System Administrator', company: 'Beeline', salary: '300000 - 500000 ₸', match: '75%' },
            { title: 'DevOps Engineer', company: 'Nurbs Tech', salary: '500000 - 800000 ₸', match: '85%' },
            { title: 'Mobile Developer (iOS/Android)', company: 'Epic Group', salary: '450000 - 700000 ₸', match: '87%' },
        ];
        
        const jobsHtml = demoJobs.map(job => `
            <div class="job-item">
                <div class="job-title">${job.title}</div>
                <div class="job-company">🏢 ${job.company}</div>
                <div class="salary">💰 ${job.salary}</div>
                <div class="match">🎯 Совпадение: ${job.match}</div>
                <div style="font-size:12px; color:#059669; margin-top:8px;">✨ Актуально для Казахстана</div>
            </div>
        `).join('');
        
        document.getElementById('jobsList').innerHTML = jobsHtml + '<div style="text-align:center; margin-top:12px; font-size:12px; color:#6b7280;">📡 Вакансии казахстанских компаний (демо)</div>';
    }

    // ========== Модальное окно профиля ==========
    function openProfileModal() {
        document.getElementById('editName').value = currentUser.name || '';
        document.getElementById('editEmail').value = currentUser.email || '';
        document.getElementById('editAvatar').value = currentUser.avatar || '👤';
        document.getElementById('profileModal').classList.remove('hidden');
    }

    function closeProfileModal() {
        document.getElementById('profileModal').classList.add('hidden');
    }

    function updateProfileModal() {
        currentUser.name = document.getElementById('editName').value;
        currentUser.email = document.getElementById('editEmail').value;
        currentUser.avatar = document.getElementById('editAvatar').value;
        saveUserToLocal();
        document.getElementById('profileName').value = currentUser.name;
        document.getElementById('profileAvatar').value = currentUser.avatar;
        document.getElementById('avatarBtn').innerHTML = currentUser.avatar || '👤';
        closeProfileModal();
        alert('✅ Профиль обновлён!');
    }

    // ========== Переключение страниц ==========
    function switchPage(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        if (page === 'profile') {
            document.getElementById('profilePage').classList.add('active-page');
        } else {
            document.getElementById('jobsPage').classList.add('active-page');
        }
        
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if (page === 'profile') {
            document.querySelectorAll('.tab')[0].classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
        }
    }

    // ========== Инициализация ==========
    loadUser();
</script>
</body>
</html>
